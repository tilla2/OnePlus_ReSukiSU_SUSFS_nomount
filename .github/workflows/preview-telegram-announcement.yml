name: Send Telegram Release Announcement

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag to announce
        required: true
        type: string
        default: nomount-dev-20260809
      announcement_type:
        description: Send a preview or the final stable announcement
        required: true
        type: choice
        default: preview
        options:
          - preview
          - stable

permissions:
  contents: read

jobs:
  announce:
    name: Send Channel Announcement
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      TG_CHANNEL_URL: ${{ vars.TG_CHANNEL_URL }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      ANNOUNCEMENT_TYPE: ${{ inputs.announcement_type }}
    steps:
      - name: Send formatted release announcement
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "::error::TG_BOT_TOKEN and TG_CHAT_ID must be configured before sending an announcement."
            exit 1
          fi

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          release_url="$(jq -r '.html_url' <<< "$release_json")"
          zip_count="$(jq '[.assets[] | select(.name | startswith("AK3_") and endswith(".zip"))] | length' <<< "$release_json")"
          models="$(jq -r '[.assets[] | select(.name | startswith("AK3_") and endswith(".zip")) | .name | split("_")[1]] | unique | join(", ")' <<< "$release_json")"
          oos_versions="$(jq -r '[.assets[] | select(.name | startswith("AK3_") and endswith(".zip")) | .name | split("_")[2]] | unique | join(", ")' <<< "$release_json")"
          root_count="$(jq '[.assets[] | select(.name | startswith("AK3_") and endswith(".zip")) | .name | split("_")[4]] | unique | length' <<< "$release_json")"
          root_token="$(jq -r '[.assets[] | select(.name | startswith("AK3_") and endswith(".zip")) | .name | split("_")[4]] | unique | first // empty' <<< "$release_json")"
          ksu_version="$(jq -r '[.assets[] | select(.name | startswith("AK3_") and endswith(".zip")) | .name | split("_")[5]] | unique | join(", ")' <<< "$release_json")"
          susfs_version="$(jq -r '[.assets[] | select(.name | startswith("AK3_") and endswith(".zip")) | .name | split("_")[7] | sub("\\.zip$"; "")] | unique | join(", ")' <<< "$release_json")"

          if [ "$zip_count" -eq 0 ]; then
            echo "::error::Release '${RELEASE_TAG}' contains no kernel ZIP assets."
            exit 1
          fi
          if [ "$root_count" -ne 1 ]; then
            echo "::error::Release '${RELEASE_TAG}' must contain exactly one root implementation."
            exit 1
          fi
          case "$root_token" in
            KSUN) root_display="KernelSU Next" ;;
            ReSukiSU) root_display="ReSukiSU" ;;
            BakaSU) root_display="BakaSU" ;;
            KSU) root_display="KernelSU" ;;
            *)
              echo "::error::Unsupported root implementation '${root_token}' in release '${RELEASE_TAG}'."
              exit 1
              ;;
          esac

          channel_line=""
          if [ -n "$TG_CHANNEL_URL" ]; then
            channel_line="
          📢 <a href=\"${TG_CHANNEL_URL}\"><b>FOLLOW REALS3S KERNEL LAB</b></a>"
          fi

          if [ "$ANNOUNCEMENT_TYPE" = "stable" ]; then
            announcement_heading="✅ <b>STABLE RELEASE</b>"
            release_heading="<b>RELEASE CARD</b> ✨"
          else
            announcement_heading="⚠️ <b>PREVIEW ONLY • FORMATTING TEST</b>"
            release_heading="<b>RELEASE CARD PREVIEW</b> ✨"
          fi

          message="${announcement_heading}
          ╭──────────────────────╮
          🌌 <b>REALS3S // KERNEL LAB</b>
          <i>OnePlus • ${root_display} • SUSFS • NoMount</i>
          ╰──────────────────────╯
          ┈
          ${release_heading}
          🏷️ <code>${RELEASE_TAG}</code>
          ┈
          <b>CORE STACK</b>
          🔐 ${root_display} <code>v${ksu_version}</code>
          🛡️ SUSFS <code>${susfs_version}</code>
          🚫 NoMount <b>integrated</b>
          ⚙️ Clang O2 • Clean build: false
          ┈
          <b>COMPATIBILITY</b>
          📦 ${zip_count} flashable packages
          💻 ${oos_versions}
          📱 ${models}
          ──────────────────────
          🌐 <a href=\"https://sss1981-op.github.io/OnePlus_ReSukiSU_SUSFS/\"><b>DOWNLOAD FROM DEVICE CATALOG (RECOMMENDED)</b></a>
          ⬇️ <a href=\"${release_url}\"><b>DOWNLOAD RELEASE</b></a>${channel_line}"

          payload="$(jq -n --arg chat_id "$TG_CHAT_ID" --arg text "$message" '{
            chat_id: $chat_id,
            parse_mode: "HTML",
            disable_web_page_preview: true,
            text: $text
          }')"

          response="$(curl --fail-with-body --silent --show-error \
            --request POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --header "Content-Type: application/json" \
            --data "$payload")"

          message_id="$(jq -r '.result.message_id // empty' <<< "$response")"
          if [ -z "$message_id" ]; then
            echo "::error::Telegram did not return a message ID."
            exit 1
          fi

          echo "${ANNOUNCEMENT_TYPE} announcement sent successfully (message ID: ${message_id})."
